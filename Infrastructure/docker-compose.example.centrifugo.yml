# Centrifugo v6 — 实时 WebSocket / SSE（模板）
# 复制为 docker-compose.centrifugo.yml 后配合根目录 .env 使用

name: nfx-stack-centrifugo

services:
  centrifugo:
    image: centrifugo/centrifugo:v6.9.4
    container_name: NFX-Stack-Centrifugo
    command: centrifugo -c config.json
    env_file:
      - ../.env
    volumes:
      - ./config/centrifugo.json:/centrifugo/config.json:ro
    ports:
      - "${CENTRIFUGO_HOST:-0.0.0.0}:${CENTRIFUGO_PORT}:8000"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "10"
    networks:
      - nfx-stack
    restart: always

networks:
  nfx-stack:
    external: true
    name: nfx-stack
