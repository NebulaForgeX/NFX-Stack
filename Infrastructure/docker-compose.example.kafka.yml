# Kafka (KRaft 单节点) + Kafka UI（模板）

name: nfx-stack-kafka

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "10"

services:
  kafka:
    image: apache/kafka:4.3.1
    container_name: NFX-Stack-Kafka
    hostname: kafka
    restart: always
    ports:
      - "${KAFKA_EXTERNAL_HOST:-0.0.0.0}:${KAFKA_EXTERNAL_PORT}:9094"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://${KAFKA_INTERNAL_HOST_IP}:${KAFKA_EXTERNAL_PORT}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - ${KAFKA_DATA_PATH:-../Databases/kafka}:/var/lib/kafka/data
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "10"
    networks:
      - nfx-stack

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: NFX-Stack-Kafka-UI
    restart: always
    depends_on:
      - kafka
    ports:
      - "${KAFKA_UI_HOST:-0.0.0.0}:${KAFKA_UI_PORT}:8080"
    environment:
      SERVER_SERVLET_CONTEXT_PATH: /
      DYNAMIC_CONFIG_ENABLED: "true"
      KAFKA_CLUSTERS_0_NAME: nfx_stack_public
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    logging: *default-logging
    networks:
      - nfx-stack

networks:
  nfx-stack:
    external: true
    name: nfx-stack
