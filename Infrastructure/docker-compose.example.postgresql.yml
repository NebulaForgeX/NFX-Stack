# PostgreSQL + pgAdmin（模板）

name: nfx-stack-postgresql

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "10"

services:
  postgresql:
    image: postgres:18.6
    container_name: NFX-Stack-PostgreSQL
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRESQL_ROOT_USERNAME}
      POSTGRES_PASSWORD: ${POSTGRESQL_ROOT_PASSWORD}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "${POSTGRESQL_DATABASE_HOST:-0.0.0.0}:${POSTGRESQL_DATABASE_PORT}:5432"
    volumes:
      # PostgreSQL 18+ 需挂载到 /var/lib/postgresql（数据在版本子目录内）
      - ${POSTGRESQL_DATA_PATH:-../Databases/postgresql}:/var/lib/postgresql
      - ${POSTGRESQL_INIT_PATH:-../Databases/postgresql-init}:/docker-entrypoint-initdb.d
      - ${POSTGRESQL_LOG_PATH:-../Logs/postgresql}:/var/log/postgresql
    logging: *default-logging
    networks:
      - nfx-stack

  postgresql-ui:
    image: dpage/pgadmin4:9.17
    container_name: NFX-Stack-PostgreSQL-UI
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: ${POSTGRESQL_UI_USERNAME:-admin@admin.com}
      PGADMIN_DEFAULT_PASSWORD: ${POSTGRESQL_UI_PASSWORD}
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      - "${POSTGRESQL_UI_HOST:-0.0.0.0}:${POSTGRESQL_UI_PORT}:80"
    depends_on:
      - postgresql
    logging: *default-logging
    networks:
      - nfx-stack

networks:
  nfx-stack:
    external: true
    name: nfx-stack
