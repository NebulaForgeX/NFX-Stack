# MySQL + phpMyAdmin（模板）
# 复制为 docker-compose.mysql.yml 后配合根目录 .env 使用

name: nfx-stack-mysql

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "10"

services:
  mysql:
    image: mysql:9.7.2
    container_name: NFX-Stack-MySQL
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_CHARACTER_SET_SERVER: utf8mb4
      MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
    ports:
      - "${MYSQL_DATABASE_HOST:-0.0.0.0}:${MYSQL_DATABASE_PORT}:3306"
    volumes:
      - ${MYSQL_DATA_PATH:-../Databases/mysql}:/var/lib/mysql
      - ${MYSQL_INIT_PATH:-../Databases/mysql-init}:/docker-entrypoint-initdb.d
      - ${MYSQL_LOG_PATH:-../Logs/mysql}:/var/log/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    logging: *default-logging
    networks:
      - nfx-stack

  mysql-ui:
    image: phpmyadmin:5.2.3
    container_name: NFX-Stack-MySQL-UI
    restart: always
    expose:
      - "80"
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_ARBITRARY: "1"
    ports:
      - "${MYSQL_UI_HOST:-0.0.0.0}:${MYSQL_UI_PORT}:80"
    depends_on:
      - mysql
    logging: *default-logging
    networks:
      - nfx-stack

networks:
  nfx-stack:
    external: true
    name: nfx-stack
