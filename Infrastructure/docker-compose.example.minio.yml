# MinIO Community 对象存储（模板）
# 最后一版官方预编译镜像（之后社区只出源码；Docker Hub 已下架，用 Quay）
# quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
# 客户端请使用 path-style（AWS SDK forcePathStyle=true）
# 从 AIStor 换过来若 /data 格式不兼容，清空 MINIO_DATA_PATH 再起。

name: nfx-stack-minio

services:
  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: NFX-Stack-MinIO
    hostname: minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_SERVER_URL: ${MINIO_SERVER_URL}
      MINIO_BROWSER_REDIRECT_URL: ${MINIO_BROWSER_REDIRECT_URL}
      MINIO_API_CORS_ALLOW_ORIGIN: "*"
    ports:
      - "${MINIO_API_HOST:-0.0.0.0}:${MINIO_API_PORT}:9000"
      - "${MINIO_UI_HOST:-0.0.0.0}:${MINIO_UI_PORT}:9001"
    volumes:
      - ${MINIO_DATA_PATH:-../Databases/minio}:/data
      - ${MINIO_LOG_PATH:-../Logs/minio}:/var/log/minio
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "10"
    networks:
      - nfx-stack

networks:
  nfx-stack:
    external: true
    name: nfx-stack
